<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rentals — Beast Rentals Admin</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div id="page-loader" class="page-loader"><span class="brand-mark"><i class="fa-solid fa-shield-dog"></i></span><span class="spinner dark"></span></div>

<div class="app-shell hidden" id="app-shell">
  <aside class="app-sidebar">
    <a href="../index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-shield-dog"></i></span>Beast Rentals</a>
    <a href="dashboard.html" class="side-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="users.html" class="side-link"><i class="fa-solid fa-users"></i> Users</a>
    <a href="shops.html" class="side-link"><i class="fa-solid fa-store"></i> Shops</a>
    <a href="farms.html" class="side-link"><i class="fa-solid fa-tractor"></i> Farms</a>
    <a href="rentals.html" class="side-link active"><i class="fa-solid fa-house-chimney"></i> Rentals</a>
    <a href="payments.html" class="side-link"><i class="fa-solid fa-credit-card"></i> Payments</a>
    <a href="transactions.html" class="side-link"><i class="fa-solid fa-clock-rotate-left"></i> Transactions</a>
    <a href="receipts.html" class="side-link"><i class="fa-solid fa-receipt"></i> Receipts</a>
    <a href="qr-management.html" class="side-link"><i class="fa-solid fa-qrcode"></i> QR Management</a>
    <a href="qr-scanner.html" class="side-link"><i class="fa-solid fa-camera"></i> QR Scanner</a>
    <a href="notifications.html" class="side-link"><i class="fa-solid fa-bell"></i> Notifications</a>
    <a href="reports.html" class="side-link"><i class="fa-solid fa-chart-line"></i> Reports</a>
    <div class="side-section-label">System</div>
    <a href="activity-logs.html" class="side-link"><i class="fa-solid fa-list-check"></i> Activity Logs</a>
    <a href="administrators.html" class="side-link"><i class="fa-solid fa-user-shield"></i> Administrators</a>
    <a href="settings.html" class="side-link"><i class="fa-solid fa-gear"></i> Settings</a>
    <a href="#" id="logout-link" class="side-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div style="display:flex; align-items:center; gap:14px;"><button class="mobile-menu-btn btn-icon"><i class="fa-solid fa-bars"></i></button><span class="page-title">Rentals</span></div>
      <div class="topbar-actions"><div class="avatar" id="avatar-initials">--</div></div>
    </div>

    <div class="app-content">
      <div class="kpi-inline panel">
        <div class="kpi"><div class="v" id="k-active">—</div><div class="l">Active</div></div>
        <div class="kpi"><div class="v" id="k-expiring">—</div><div class="l">Expiring (≤30d)</div></div>
        <div class="kpi"><div class="v" id="k-expired">—</div><div class="l">Expired</div></div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="search-input" placeholder="Search by serial, unit..."></div>
          <select id="type-filter"><option value="">All Types</option><option value="SHOP">Shop</option><option value="FARM">Farm</option></select>
          <select id="status-filter"><option value="">All Status</option><option value="active">Active</option><option value="expiring">Expiring</option><option value="expired">Expired</option><option value="pending_payment">Pending Payment</option></select>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Serial</th><th>Type</th><th>Unit No.</th><th>Start</th><th>Expiry</th><th>Status</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="6" style="text-align:center; padding:30px;"><span class="spinner dark"></span></td></tr></tbody>
          </table>
        </div>
        <div id="empty-state" class="empty-state hidden"><i class="fa-solid fa-house"></i><h4>No rentals found.</h4></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { requireAdmin, logoutUser } from "../assets/js/auth.js";
  import { listRentals, getGeneralSettings } from "../assets/js/admin.js";

  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logoutUser(); });

  let allRentals = [], thresholds = { greenMinDays: 60, yellowMinDays: 30 };

  requireAdmin(async (user, adminData) => {
    document.getElementById("page-loader").classList.add("hidden");
    document.getElementById("app-shell").classList.remove("hidden");
    document.getElementById("avatar-initials").textContent = getInitials(adminData?.name || user.email);

    const settings = await getGeneralSettings();
    if (settings?.thresholds) thresholds = settings.thresholds;
    allRentals = await listRentals();
    render();
  });

  function computeStatus(r) {
    if (!r.expiryDate) return "pending_payment";
    const status = getRentalStatus(r.expiryDate, thresholds);
    if (status.level === "red" && status.daysLeft === 0) return "expired";
    if (status.level === "green") return "active";
    return "expiring";
  }

  function render() {
    const term = document.getElementById("search-input").value.trim().toLowerCase();
    const type = document.getElementById("type-filter").value;
    const statusFilter = document.getElementById("status-filter").value;

    const enriched = allRentals.map(r => ({ ...r, computedStatus: computeStatus(r) }));

    document.getElementById("k-active").textContent = enriched.filter(r => r.computedStatus === "active").length;
    document.getElementById("k-expiring").textContent = enriched.filter(r => r.computedStatus === "expiring").length;
    document.getElementById("k-expired").textContent = enriched.filter(r => r.computedStatus === "expired").length;

    const filtered = enriched.filter(r => {
      const matchesTerm = !term || (r.serialNumber || "").toLowerCase().includes(term) || String(r.unitNumber || "").toLowerCase().includes(term);
      const matchesType = !type || r.type === type;
      const matchesStatus = !statusFilter || r.computedStatus === statusFilter;
      return matchesTerm && matchesType && matchesStatus;
    });

    const tbody = document.getElementById("tbody");
    const empty = document.getElementById("empty-state");
    if (!filtered.length) { tbody.innerHTML = ""; empty.classList.remove("hidden"); return; }
    empty.classList.add("hidden");

    const badgeMap = { active: "badge-green", expiring: "badge-yellow", expired: "badge-red", pending_payment: "badge-gray" };
    const labelMap = { active: "ACTIVE", expiring: "EXPIRING SOON", expired: "EXPIRED", pending_payment: "PENDING PAYMENT" };

    tbody.innerHTML = filtered.map(r => `
      <tr>
        <td style="font-family:monospace;">${r.serialNumber || "—"}</td>
        <td>${r.type || "—"}</td>
        <td>${r.unitNumber || "—"}</td>
        <td>${r.startDate ? formatDate(r.startDate) : "—"}</td>
        <td>${r.expiryDate ? formatDate(r.expiryDate) : "—"}</td>
        <td><span class="badge ${badgeMap[r.computedStatus]}">${labelMap[r.computedStatus]}</span></td>
      </tr>
    `).join("");
  }

  document.getElementById("search-input").addEventListener("input", render);
  document.getElementById("type-filter").addEventListener("change", render);
  document.getElementById("status-filter").addEventListener("change", render);
</script>
<script src="../assets/js/utils.js"></script>
</body>
</html>
